<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cytoscape Test</title>
    <script src="cytoscape.min.js"></script>
    <style>
        #cy {
            width: 100%;
            height: 600px;
            border: 1px solid #ccc;
        }
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        button {
            padding: 10px 20px;
            background-color: #2196F3;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-bottom: 20px;
        }
        button:hover {
            background-color: #1976D2;
        }
        #logs {
            margin-top: 20px;
            padding: 10px;
            background-color: #f5f5f5;
            border: 1px solid #ddd;
            border-radius: 4px;
            max-height: 200px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <h1>Cytoscape Node Creation Test</h1>
    
    <button id="createNodeBtn">Create Node</button>
    <button id="clearBtn">Clear All</button>
    
    <div id="cy"></div>
    
    <div id="logs"></div>
    
    <script>
        // 日志函数
        function log(message) {
            console.log('Test: ' + message);
            const logsDiv = document.getElementById('logs');
            const logEntry = document.createElement('div');
            logEntry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            logsDiv.appendChild(logEntry);
            logsDiv.scrollTop = logsDiv.scrollHeight;
        }
        
        // 初始化Cytoscape
        let cy;
        
        function initCytoscape() {
            try {
                cy = cytoscape({
                    container: document.getElementById('cy'),
                    layout: {
                        name: 'cose',
                        padding: 10
                    },
                    style: [
                        {
                            selector: 'node',
                            style: {
                                'background-color': '#2196F3',
                                'color': '#FFFFFF',
                                'width': '50px',
                                'height': '50px',
                                'font-size': '12px',
                                'label': 'data(label)'
                            }
                        },
                        {
                            selector: 'edge',
                            style: {
                                'width': 3,
                                'line-color': '#ccc',
                                'target-arrow-color': '#ccc',
                                'target-arrow-shape': 'triangle'
                            }
                        }
                    ],
                    elements: []
                });
                
                log('Cytoscape initialized successfully');
                return true;
            } catch (error) {
                log('ERROR initializing Cytoscape: ' + error.message);
                console.error(error);
                return false;
            }
        }
        
        // 创建节点函数
        function createNode() {
            if (!cy) {
                log('ERROR: Cytoscape not initialized');
                return;
            }
            
            try {
                const nodeId = 'node_' + Date.now();
                const randomX = Math.random() * 400 + 50;
                const randomY = Math.random() * 400 + 50;
                
                log('Creating node with ID: ' + nodeId);
                
                // 创建节点
                const node = {
                    group: 'nodes',
                    data: { id: nodeId, label: 'Test' },
                    position: { x: randomX, y: randomY }
                };
                
                // 添加节点
                cy.add(node);
                log('Node added to graph');
                
                // 验证节点存在
                const addedNode = cy.getElementById(nodeId);
                if (addedNode) {
                    log('Node exists in graph: ' + addedNode.id());
                    log('Node visible: ' + addedNode.visible());
                } else {
                    log('ERROR: Node not found after addition');
                }
                
                // 重新布局
                cy.layout({ name: 'cose' }).run();
                log('Layout updated');
                
            } catch (error) {
                log('ERROR creating node: ' + error.message);
                console.error(error);
            }
        }
        
        // 清除所有元素
        function clearAll() {
            if (cy) {
                cy.remove('node, edge');
                log('All elements cleared');
            }
        }
        
        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', function() {
            log('Page loaded, initializing test');
            
            // 初始化Cytoscape
            const initialized = initCytoscape();
            
            if (initialized) {
                // 添加事件监听器
                document.getElementById('createNodeBtn').addEventListener('click', createNode);
                document.getElementById('clearBtn').addEventListener('click', clearAll);
                log('Event listeners added');
                
                // 测试点击画布创建节点
                cy.on('tap', function(evt) {
                    if (evt.target === cy) {
                        log('Canvas tapped at position: ' + JSON.stringify(evt.position));
                        const nodeId = 'click_node_' + Date.now();
                        const node = {
                            group: 'nodes',
                            data: { id: nodeId, label: 'Click' },
                            position: evt.position
                        };
                        cy.add(node);
                        log('Node created at click position');
                    }
                });
            }
        });
    </script>
</body>
</html>
