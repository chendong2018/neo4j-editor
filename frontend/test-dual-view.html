<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>双视图图数据模型测试</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif;
            line-height: 1.6;
            color: #333;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
            padding: 24px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 28px;
            font-weight: 600;
        }
        
        .header p {
            margin-top: 8px;
            opacity: 0.9;
        }
        
        .content {
            padding: 24px;
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 24px;
        }
        
        @media (max-width: 768px) {
            .content {
                grid-template-columns: 1fr;
            }
        }
        
        .sidebar {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            height: fit-content;
        }
        
        .main {
            background: #ffffff;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #e9ecef;
        }
        
        .panel {
            margin-bottom: 24px;
        }
        
        .panel h3 {
            color: #2c3e50;
            margin-bottom: 12px;
            font-size: 18px;
            border-bottom: 2px solid #3498db;
            padding-bottom: 8px;
        }
        
        .form-group {
            margin-bottom: 16px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 500;
            color: #495057;
        }
        
        .form-group select,
        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ced4da;
            border-radius: 6px;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        
        .form-group select:focus,
        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #3498db;
            box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.1);
        }
        
        .btn {
            padding: 10px 20px;
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 500;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(79, 172, 254, 0.3);
        }
        
        .btn:active {
            transform: translateY(0);
        }
        
        .btn-group {
            display: flex;
            gap: 10px;
            margin-bottom: 16px;
        }
        
        .btn-secondary {
            background: linear-gradient(135deg, #6c757d 0%, #adb5bd 100%);
        }
        
        .btn-danger {
            background: linear-gradient(135deg, #dc3545 0%, #e57373 100%);
        }
        
        .log-container {
            background: #2d3748;
            color: #e2e8f0;
            padding: 16px;
            border-radius: 6px;
            max-height: 400px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 14px;
        }
        
        .log-entry {
            margin-bottom: 8px;
            padding: 4px 0;
            border-bottom: 1px solid #4a5568;
        }
        
        .log-entry:last-child {
            border-bottom: none;
        }
        
        .log-info {
            color: #90cdf4;
        }
        
        .log-success {
            color: #9ae6b4;
        }
        
        .log-warning {
            color: #fbd38d;
        }
        
        .log-error {
            color: #feb2b2;
        }
        
        .tabs {
            display: flex;
            border-bottom: 1px solid #e2e8f0;
            margin-bottom: 20px;
        }
        
        .tab {
            padding: 12px 24px;
            cursor: pointer;
            border: none;
            background: none;
            font-size: 16px;
            font-weight: 500;
            color: #718096;
            border-bottom: 2px solid transparent;
            transition: all 0.3s;
        }
        
        .tab:hover {
            background: #f7fafc;
            color: #4a5568;
        }
        
        .tab.active {
            color: #3182ce;
            border-bottom-color: #3182ce;
            background: #ebf8ff;
        }
        
        .tab-content {
            display: none;
        }
        
        .tab-content.active {
            display: block;
            animation: fadeIn 0.3s ease;
        }
        
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .json-viewer {
            background: #f7fafc;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            padding: 16px;
            max-height: 400px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 14px;
        }
        
        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .checkbox-group input[type="checkbox"] {
            width: auto;
            margin: 0;
        }
        
        .status-bar {
            background: #f8f9fa;
            padding: 12px 20px;
            border-top: 1px solid #e9ecef;
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            color: #6c757d;
        }
        
        .badge {
            background: #3498db;
            color: white;
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>双视图图数据模型测试平台</h1>
            <p>支持上下文感知的节点创建与自动关系维护</p>
        </div>
        
        <div class="content">
            <div class="sidebar">
                <div class="panel">
                    <h3>操作面板</h3>
                    
                    <div class="form-group">
                        <label for="nodeName">节点名称</label>
                        <input type="text" id="nodeName" placeholder="输入节点名称">
                    </div>
                    
                    <div class="form-group">
                        <label for="nodeLabels">节点标签</label>
                        <input type="text" id="nodeLabels" placeholder="用逗号分隔，如：Service,Component">
                    </div>
                    
                    <div class="form-group">
                        <label for="nodeProperties">节点属性</label>
                        <textarea id="nodeProperties" rows="3" placeholder='JSON格式，如：{"port": 8001, "status": "active"}'></textarea>
                    </div>
                    
                    <div class="form-group">
                        <label for="parentId">父节点ID</label>
                        <select id="parentId">
                            <option value="">无父节点（根节点）</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label for="context">创建上下文</label>
                        <select id="context">
                            <option value="tree">层级树视图</option>
                            <option value="network">关系网视图</option>
                        </select>
                    </div>
                    
                    <button class="btn" id="createNodeBtn">创建节点</button>
                </div>
                
                <div class="panel">
                    <h3>移动节点</h3>
                    
                    <div class="form-group">
                        <label for="moveNodeId">节点ID</label>
                        <select id="moveNodeId">
                            <option value="">选择节点</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label for="newParentId">新父节点ID</label>
                        <select id="newParentId">
                            <option value="">无父节点（根节点）</option>
                        </select>
                    </div>
                    
                    <div class="form-group checkbox-group">
                        <input type="checkbox" id="autoConnect" checked>
                        <label for="autoConnect">自动连接新兄弟节点</label>
                    </div>
                    
                    <button class="btn" id="moveNodeBtn">移动节点</button>
                </div>
                
                <div class="panel">
                    <h3>关系操作</h3>
                    
                    <div class="form-group">
                        <label for="nodeId1">源节点ID</label>
                        <select id="nodeId1">
                            <option value="">选择节点</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label for="nodeId2">目标节点ID</label>
                        <select id="nodeId2">
                            <option value="">选择节点</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label for="relProperties">关系属性</label>
                        <textarea id="relProperties" rows="2" placeholder='JSON格式，如：{"description": "依赖关系"}'></textarea>
                    </div>
                    
                    <button class="btn" id="addRelBtn">添加RELATES_TO关系</button>
                </div>
                
                <div class="panel">
                    <h3>查询操作</h3>
                    
                    <div class="btn-group">
                        <button class="btn" id="getHierarchyBtn">获取层级树</button>
                    </div>
                    
                    <div class="form-group">
                        <label for="networkNodeId">查看关系网（节点ID）</label>
                        <select id="networkNodeId">
                            <option value="">选择节点</option>
                        </select>
                    </div>
                    
                    <button class="btn" id="getNetworkBtn">获取关系网</button>
                    
                    <button class="btn btn-danger" id="clearAllBtn">清空所有数据</button>
                </div>
            </div>
            
            <div class="main">
                <div class="tabs">
                    <button class="tab active" data-tab="log">操作日志</button>
                    <button class="tab" data-tab="hierarchy">层级树</button>
                    <button class="tab" data-tab="network">关系网</button>
                    <button class="tab" data-tab="nodes">节点列表</button>
                </div>
                
                <div id="log" class="tab-content active">
                    <div class="log-container" id="logContainer">
                        <div class="log-entry log-info">双视图图数据模型测试平台已启动</div>
                        <div class="log-entry log-info">请使用左侧面板进行操作</div>
                    </div>
                </div>
                
                <div id="hierarchy" class="tab-content">
                    <h3>层级树结构</h3>
                    <div class="json-viewer" id="hierarchyViewer">
                        请点击"获取层级树"按钮查看层级结构
                    </div>
                </div>
                
                <div id="network" class="tab-content">
                    <h3>关系网数据</h3>
                    <div class="json-viewer" id="networkViewer">
                        请选择节点并点击"获取关系网"按钮查看
                    </div>
                </div>
                
                <div id="nodes" class="tab-content">
                    <h3>节点列表</h3>
                    <div class="json-viewer" id="nodesViewer">
                        节点列表将显示在这里
                    </div>
                </div>
            </div>
        </div>
        
        <div class="status-bar">
            <div>
                <span class="badge" id="nodeCount">节点: 0</span>
                <span class="badge" id="relCount" style="margin-left: 8px;">关系: 0</span>
            </div>
            <div>双视图图数据模型 v1.0</div>
        </div>
    </div>

    <script src="js/utils/graphUtils.js"></script>
    <script src="js/services/graphDataService.js"></script>
    <script>
        // 初始化图数据服务
        const graphService = new GraphDataService({
            autoConnectInTreeCreation: true,
            autoConnectOnMove: false
        });
        
        // DOM 元素
        const logContainer = document.getElementById('logContainer');
        const createNodeBtn = document.getElementById('createNodeBtn');
        const moveNodeBtn = document.getElementById('moveNodeBtn');
        const addRelBtn = document.getElementById('addRelBtn');
        const getHierarchyBtn = document.getElementById('getHierarchyBtn');
        const getNetworkBtn = document.getElementById('getNetworkBtn');
        const clearAllBtn = document.getElementById('clearAllBtn');
        const tabs = document.querySelectorAll('.tab');
        
        // 日志记录函数
        function log(message, type = 'info') {
            const logEntry = document.createElement('div');
            logEntry.className = `log-entry log-${type}`;
            logEntry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            logContainer.appendChild(logEntry);
            logContainer.scrollTop = logContainer.scrollHeight;
        }
        
        // 更新节点选择列表
        function updateNodeSelectors() {
            const selectors = [
                document.getElementById('parentId'),
                document.getElementById('newParentId'),
                document.getElementById('moveNodeId'),
                document.getElementById('nodeId1'),
                document.getElementById('nodeId2'),
                document.getElementById('networkNodeId')
            ];
            
            const nodes = graphService.getAllNodes();
            
            selectors.forEach(selector => {
                // 保存当前选中的值
                const selectedValue = selector.value;
                
                // 清空并添加默认选项
                selector.innerHTML = selector.id === 'moveNodeId' || 
                                    selector.id === 'nodeId1' || 
                                    selector.id === 'nodeId2' || 
                                    selector.id === 'networkNodeId' ? 
                    '<option value="">选择节点</option>' : 
                    '<option value="">无父节点（根节点）</option>';
                
                // 添加节点选项
                nodes.forEach(node => {
                    const option = document.createElement('option');
                    option.value = node.id;
                    option.textContent = `${node.properties.name || '未命名节点'} (${node.id})`;
                    selector.appendChild(option);
                });
                
                // 恢复选中状态（如果仍然存在）
                if (selectedValue) {
                    const option = selector.querySelector(`option[value="${selectedValue}"]`);
                    if (option) {
                        option.selected = true;
                    }
                }
            });
            
            // 更新状态计数
            document.getElementById('nodeCount').textContent = `节点: ${nodes.length}`;
            document.getElementById('relCount').textContent = `关系: ${graphService.getAllRelationships().length}`;
            
            // 更新节点列表视图
            if (document.querySelector('#nodes').classList.contains('active')) {
                renderNodesList();
            }
        }
        
        // 渲染层级树
        function renderHierarchy() {
            try {
                const hierarchy = graphService.getHierarchyTree();
                const hierarchyViewer = document.getElementById('hierarchyViewer');
                hierarchyViewer.textContent = JSON.stringify(hierarchy, null, 2);
                log('成功获取层级树', 'success');
            } catch (error) {
                log('获取层级树失败: ' + error.message, 'error');
            }
        }
        
        // 渲染关系网
        function renderNetwork(nodeId) {
            if (!nodeId) {
                log('请选择节点', 'warning');
                return;
            }
            
            try {
                const network = graphService.getSiblingNetwork(nodeId);
                const networkViewer = document.getElementById('networkViewer');
                networkViewer.textContent = JSON.stringify(network, null, 2);
                log(`成功获取节点 ${nodeId} 的关系网`, 'success');
            } catch (error) {
                log('获取关系网失败: ' + error.message, 'error');
            }
        }
        
        // 渲染节点列表
        function renderNodesList() {
            const nodes = graphService.getAllNodes();
            const nodesViewer = document.getElementById('nodesViewer');
            
            const nodesData = nodes.map(node => {
                const parentId = graphService._findParentNode(node.id);
                return {
                    id: node.id,
                    name: node.properties.name || '未命名',
                    labels: node.labels,
                    parentId: parentId,
                    properties: node.properties
                };
            });
            
            nodesViewer.textContent = JSON.stringify(nodesData, null, 2);
        }
        
        // 选项卡切换
        tabs.forEach(tab => {
            tab.addEventListener('click', () => {
                // 移除所有激活状态
                document.querySelectorAll('.tab').forEach(t => {
                    t.classList.remove('active');
                });
                document.querySelectorAll('.tab-content').forEach(content => {
                    content.classList.remove('active');
                });
                
                // 设置当前激活状态
                tab.classList.add('active');
                const tabContent = document.getElementById(tab.dataset.tab);
                tabContent.classList.add('active');
                
                // 如果切换到节点列表，更新内容
                if (tab.dataset.tab === 'nodes') {
                    renderNodesList();
                }
            });
        });
        
        // 创建节点按钮事件
        createNodeBtn.addEventListener('click', () => {
            const nodeName = document.getElementById('nodeName').value.trim();
            const nodeLabels = document.getElementById('nodeLabels').value.trim()
                ? document.getElementById('nodeLabels').value.trim().split(',').map(l => l.trim())
                : ['Node'];
            const nodePropertiesText = document.getElementById('nodeProperties').value.trim();
            const parentId = document.getElementById('parentId').value;
            const context = document.getElementById('context').value;
            
            if (!nodeName) {
                log('请输入节点名称', 'warning');
                return;
            }
            
            let nodeProperties;
            try {
                nodeProperties = nodePropertiesText ? JSON.parse(nodePropertiesText) : {};
            } catch (error) {
                log('节点属性格式错误，请检查JSON格式', 'error');
                return;
            }
            
            try {
                const nodeData = {
                    labels: nodeLabels,
                    properties: {
                        name: nodeName,
                        ...nodeProperties
                    }
                };
                
                const node = graphService.createNodeWithContext(nodeData, parentId, context);
                log(`成功创建节点: ${nodeName} (${node.id})`, 'success');
                log(`创建上下文: ${context === 'tree' ? '层级树视图' : '关系网视图'}`, 'info');
                log(`父节点: ${parentId || '无（根节点）'}`, 'info');
                
                // 清空表单
                document.getElementById('nodeName').value = '';
                document.getElementById('nodeLabels').value = '';
                document.getElementById('nodeProperties').value = '';
                
                // 更新选择列表
                updateNodeSelectors();
                
            } catch (error) {
                log('创建节点失败: ' + error.message, 'error');
            }
        });
        
        // 移动节点按钮事件
        moveNodeBtn.addEventListener('click', () => {
            const nodeId = document.getElementById('moveNodeId').value;
            const newParentId = document.getElementById('newParentId').value;
            const autoConnect = document.getElementById('autoConnect').checked;
            
            if (!nodeId) {
                log('请选择要移动的节点', 'warning');
                return;
            }
            
            try {
                graphService.moveNode(nodeId, newParentId, autoConnect);
                const node = graphService.getNode(nodeId);
                log(`成功移动节点: ${node?.properties.name || nodeId}`, 'success');
                log(`新父节点: ${newParentId || '无（根节点）'}`, 'info');
                log(`自动连接新兄弟: ${autoConnect ? '是' : '否'}`, 'info');
                
                // 更新视图
                updateNodeSelectors();
                
            } catch (error) {
                log('移动节点失败: ' + error.message, 'error');
            }
        });
        
        // 添加关系按钮事件
        addRelBtn.addEventListener('click', () => {
            const nodeId1 = document.getElementById('nodeId1').value;
            const nodeId2 = document.getElementById('nodeId2').value;
            const relPropertiesText = document.getElementById('relProperties').value.trim();
            
            if (!nodeId1 || !nodeId2) {
                log('请选择两个节点', 'warning');
                return;
            }
            
            if (nodeId1 === nodeId2) {
                log('不能在同一个节点之间创建关系', 'warning');
                return;
            }
            
            let relProperties;
            try {
                relProperties = relPropertiesText ? JSON.parse(relPropertiesText) : {};
            } catch (error) {
                log('关系属性格式错误，请检查JSON格式', 'error');
                return;
            }
            
            try {
                const [rel1, rel2] = graphService.addRelatesTo(nodeId1, nodeId2, relProperties);
                const node1 = graphService.getNode(nodeId1);
                const node2 = graphService.getNode(nodeId2);
                log(`成功创建RELATES_TO关系: ${node1?.properties.name || nodeId1} -> ${node2?.properties.name || nodeId2}`, 'success');
                
                // 更新状态计数
                document.getElementById('relCount').textContent = `关系: ${graphService.getAllRelationships().length}`;
                
            } catch (error) {
                log('创建关系失败: ' + error.message, 'error');
            }
        });
        
        // 获取层级树按钮事件
        getHierarchyBtn.addEventListener('click', () => {
            // 切换到层级树选项卡
            document.querySelector('.tab[data-tab="hierarchy"]').click();
            renderHierarchy();
        });
        
        // 获取关系网按钮事件
        getNetworkBtn.addEventListener('click', () => {
            const nodeId = document.getElementById('networkNodeId').value;
            if (!nodeId) {
                log('请选择节点', 'warning');
                return;
            }
            
            // 切换到关系网选项卡
            document.querySelector('.tab[data-tab="network"]').click();
            renderNetwork(nodeId);
        });
        
        // 清空所有数据按钮事件
        clearAllBtn.addEventListener('click', () => {
            if (confirm('确定要清空所有数据吗？此操作不可撤销。')) {
                graphService.clear();
                log('已清空所有数据', 'info');
                
                // 更新视图
                updateNodeSelectors();
                document.getElementById('hierarchyViewer').textContent = '已清空';
                document.getElementById('networkViewer').textContent = '已清空';
                document.getElementById('nodesViewer').textContent = '已清空';
            }
        });
        
        // 初始化
        log('初始化完成，可以开始测试', 'success');
    </script>
</body>
</html>
