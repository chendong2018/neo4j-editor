<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neo4j 渲染器演示 - 双视图可视化</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #f5f5f5;
      color: #333;
      line-height: 1.6;
      padding: 20px;
    }
    
    .container {
      max-width: 1400px;
      margin: 0 auto;
    }
    
    .header {
      text-align: center;
      margin-bottom: 30px;
      padding: 20px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border-radius: 10px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }
    
    .header h1 {
      font-size: 2em;
      margin-bottom: 10px;
    }
    
    .canvas-container {
      display: flex;
      gap: 20px;
      margin-bottom: 30px;
      height: 600px;
    }
    
    .canvas-wrapper {
      flex: 1;
      background: white;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      overflow: hidden;
      position: relative;
    }
    
    .canvas-title {
      padding: 15px 20px;
      background: #333;
      color: white;
      font-weight: bold;
      border-bottom: 2px solid #555;
    }
    
    .canvas {
      width: 100%;
      height: calc(100% - 50px);
      background: #fafafa;
    }
    
    .controls {
      background: white;
      border-radius: 8px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      margin-bottom: 30px;
    }
    
    .controls h2 {
      margin-bottom: 15px;
      color: #444;
      border-bottom: 2px solid #eee;
      padding-bottom: 10px;
    }
    
    .button-group {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }
    
    .btn {
      padding: 10px 20px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      transition: all 0.3s ease;
    }
    
    .btn-primary { background: #3498db; color: white; }
    .btn-primary:hover { background: #2980b9; }
    
    .btn-secondary { background: #2ecc71; color: white; }
    .btn-secondary:hover { background: #27ae60; }
    
    .btn-danger { background: #e74c3c; color: white; }
    .btn-danger:hover { background: #c0392b; }
    
    .btn-info { background: #9b59b6; color: white; }
    .btn-info:hover { background: #8e44ad; }
    
    .options-group {
      margin-bottom: 20px;
    }
    
    .option-row {
      display: flex;
      align-items: center;
      gap: 15px;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }
    
    .option-row label {
      font-weight: 500;
      min-width: 100px;
      color: #555;
    }
    
    input[type="number"],
    select {
      padding: 8px 12px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 14px;
      width: 120px;
    }
    
    .info-text {
      background: #f8f9fa;
      padding: 15px;
      border-radius: 6px;
      border-left: 4px solid #3498db;
      margin-bottom: 20px;
    }
    
    @media (max-width: 768px) {
      .canvas-container {
        flex-direction: column;
        height: auto;
      }
      
      .canvas-wrapper {
        height: 400px;
        margin-bottom: 20px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Neo4j 渲染器演示</h1>
      <p>双视图可视化：层级树视图与关系网络视图</p>
    </div>
    
    <div class="info-text">
      <strong>使用说明：</strong>点击下方按钮生成图数据并渲染。在画布上可拖拽平移，使用鼠标滚轮缩放。两个画布共享同一数据源，但各自独立渲染和交互。
    </div>
    
    <div class="controls">
      <h2>控制选项</h2>
      
      <div class="options-group">
        <div class="option-row">
          <label for="node-count">节点数量:</label>
          <input type="number" id="node-count" min="3" max="30" value="10">
          
          <label for="edge-count">边数量:</label>
          <input type="number" id="edge-count" min="2" max="50" value="15">
          
          <label for="network-layout">网络布局:</label>
          <select id="network-layout">
            <option value="force">力导向</option>
            <option value="grid">网格</option>
            <option value="circular">环形</option>
          </select>
        </div>
      </div>
      
      <div class="button-group">
        <button id="generate-data-btn" class="btn btn-primary">生成新数据</button>
        <button id="render-both-btn" class="btn btn-secondary">渲染两个视图</button>
        <button id="render-tree-btn" class="btn btn-info">仅渲染树视图</button>
        <button id="render-network-btn" class="btn btn-info">仅渲染网络视图</button>
        <button id="reset-view-btn" class="btn btn-danger">重置视图</button>
      </div>
    </div>
    
    <div class="canvas-container">
      <div class="canvas-wrapper">
        <div class="canvas-title">层级树视图</div>
        <div id="tree-canvas" class="canvas"></div>
      </div>
      
      <div class="canvas-wrapper">
        <div class="canvas-title">关系网络视图</div>
        <div id="network-canvas" class="canvas"></div>
      </div>
    </div>
  </div>
  
  <!-- 渲染器脚本 - 按正确顺序加载 -->
  <script src="../render/baseRenderer.js"></script>
  <script src="../render/treeCanvas.js"></script>
  <script src="../render/networkCanvas.js"></script>
  <script src="../render/index.js"></script>
  
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      console.log('渲染器演示初始化...');
      
      // 初始化渲染器
      let dualRenderer;
      let currentData;
      let currentNetworkContext = null;
      
      // 加载渲染器
      function loadRenderers() {
        try {
          // 创建双视图渲染器
          dualRenderer = Neo4jRenderers.createDualViewRenderer({
            tree: 'tree-canvas',
            network: 'network-canvas'
          });
          
          console.log('渲染器初始化成功');
          return true;
        } catch (error) {
          console.error('渲染器初始化失败:', error);
          return false;
        }
      }
      
      // 生成并渲染示例数据
      function generateAndRenderData() {
        try {
          const nodeCount = parseInt(document.getElementById('node-count').value) || 10;
          const edgeCount = parseInt(document.getElementById('edge-count').value) || 15;
          
          // 确保边数量至少为节点数-1（保证连通性）
          const adjustedEdgeCount = Math.max(nodeCount - 1, edgeCount);
          
          // 生成模拟数据
          currentData = Neo4jRenderers.generateMockData(nodeCount, adjustedEdgeCount);
          
          console.log('生成数据成功:', {
            nodeCount: currentData.nodes.length,
            edgeCount: currentData.edges.length
          });
          
          // 渲染数据
          if (dualRenderer) {
            const layoutType = document.getElementById('network-layout').value;
            if (dualRenderer.networkCanvas && typeof dualRenderer.networkCanvas.setLayoutType === 'function') {
              dualRenderer.networkCanvas.setLayoutType(layoutType);
            }
            dualRenderer.render(currentData, currentNetworkContext);
            console.log('数据渲染完成');
          }
        } catch (error) {
          console.error('生成数据失败:', error);
          alert('生成数据失败');
        }
      }
      
      // 更新网络布局
      function updateNetworkLayout() {
        const layoutType = document.getElementById('network-layout').value;
        if (dualRenderer && dualRenderer.networkCanvas) {
          if (typeof dualRenderer.networkCanvas.setLayoutType === 'function') {
            dualRenderer.networkCanvas.setLayoutType(layoutType);
            // 重新渲染网络视图
            if (currentData) {
              dualRenderer.render(currentData, currentNetworkContext);
            }
          }
        }
      }
      
      // 重置视图
      function resetView() {
        if (dualRenderer) {
          dualRenderer.resetView();
        }
      }
      
      // 绑定事件监听器
      document.getElementById('generate-data-btn').addEventListener('click', generateAndRenderData);
      document.getElementById('reset-view-btn').addEventListener('click', resetView);
      document.getElementById('network-layout').addEventListener('change', updateNetworkLayout);
      
      // 保留原有按钮功能，但使用新的渲染器
      document.getElementById('render-both-btn').addEventListener('click', function() {
        if (currentData && dualRenderer) {
          dualRenderer.render(currentData, currentNetworkContext);
        }
      });
      
      document.getElementById('render-tree-btn').addEventListener('click', function() {
        if (currentData && dualRenderer && dualRenderer.treeCanvas) {
          dualRenderer.treeCanvas.render(currentData);
        }
      });
      
      document.getElementById('render-network-btn').addEventListener('click', function() {
        if (currentData && dualRenderer && dualRenderer.networkCanvas) {
          const layoutType = document.getElementById('network-layout').value;
          dualRenderer.networkCanvas.setLayoutType(layoutType);
          dualRenderer.networkCanvas.render(currentData);
        }
      });
      
      // 尝试加载渲染器
      if (!loadRenderers()) {
        // 如果首次加载失败，尝试延迟重试
        setTimeout(() => {
          loadRenderers();
          // 如果成功加载，生成并渲染数据
          if (dualRenderer) {
            generateAndRenderData();
          }
        }, 500);
      } else {
        // 首次加载成功，生成并渲染数据
        generateAndRenderData();
      }
      
      console.log('演示脚本加载完成');
    });
  </script>
</body>
</html>
