<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>简化版双画布图编辑器演示</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    
    .toolbar {
      background-color: #f5f5f5;
      padding: 10px;
      border-bottom: 1px solid #ddd;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    
    .mode-buttons button {
      padding: 8px 16px;
      border: 1px solid #ccc;
      background-color: white;
      cursor: pointer;
      border-radius: 4px;
    }
    
    .mode-buttons button.active {
      background-color: #4CAF50;
      color: white;
      border-color: #4CAF50;
    }
    
    .content {
      flex: 1;
      display: flex;
      overflow: hidden;
    }
    
    .canvas-container {
      flex: 1;
      border-right: 1px solid #ddd;
      position: relative;
    }
    
    .canvas-container:last-child {
      border-right: none;
    }
    
    canvas {
      width: 100%;
      height: 100%;
      cursor: default;
    }
    
    .canvas-title {
      position: absolute;
      top: 10px;
      left: 10px;
      background-color: rgba(255, 255, 255, 0.9);
      padding: 5px 10px;
      border-radius: 4px;
      font-weight: bold;
      z-index: 10;
    }
    
    .property-panel {
      width: 300px;
      background-color: #f9f9f9;
      border-left: 1px solid #ddd;
      overflow-y: auto;
      padding: 20px;
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <div class="mode-buttons">
      <button id="select-mode-btn" class="active">选择模式</button>
      <button id="node-mode-btn">节点模式</button>
      <button id="relationship-mode-btn">关系模式</button>
    </div>
    <button id="reset-btn">重置画布</button>
  </div>
  
  <div class="content">
    <div class="canvas-container">
      <div class="canvas-title">层级树画布</div>
      <canvas id="tree-canvas"></canvas>
    </div>
    <div class="canvas-container">
      <div class="canvas-title">关系网画布</div>
      <canvas id="network-canvas"></canvas>
    </div>
    <div id="property-panel" class="property-panel">
      <p>请选择一个节点或关系查看属性</p>
    </div>
  </div>

  <!-- 加载双画布编辑器的核心组件 -->
  <script src="./EventBus.js"></script>
  
  <!-- 简化版GraphDataService -->
  <script>
    class GraphDataService {
      constructor() {
        this.nodes = new Map();
        this.relationships = new Map();
        this.index = {
          nodeToRelationships: {}
        };
      }
      
      addNode(node) {
        this.nodes.set(node.id, node);
        if (!this.index.nodeToRelationships[node.id]) {
          this.index.nodeToRelationships[node.id] = [];
        }
      }
      
      addRelationship(rel) {
        this.relationships.set(rel.id, rel);
        if (!this.index.nodeToRelationships[rel.startNodeId]) {
          this.index.nodeToRelationships[rel.startNodeId] = [];
        }
        if (!this.index.nodeToRelationships[rel.endNodeId]) {
          this.index.nodeToRelationships[rel.endNodeId] = [];
        }
        this.index.nodeToRelationships[rel.startNodeId].push(rel.id);
        this.index.nodeToRelationships[rel.endNodeId].push(rel.id);
      }
      
      getNode(id) {
        return this.nodes.get(id);
      }
      
      getRelationship(id) {
        return this.relationships.get(id);
      }
      
      getAllNodes() {
        return Array.from(this.nodes.values());
      }
      
      getAllRelationships() {
        return Array.from(this.relationships.values());
      }
      
      getRelationshipsForNode(nodeId) {
        const relIds = this.index.nodeToRelationships[nodeId] || [];
        return relIds.map(id => this.relationships.get(id));
      }
      
      getChildren(nodeId) {
        const children = [];
        this.relationships.forEach(rel => {
          if (rel.type === 'CHILD_OF' && rel.endNodeId === nodeId) {
            children.push(this.getNode(rel.startNodeId));
          }
        });
        return children;
      }
      
      removeNode(nodeId) {
        // 删除节点及其相关关系
        const relationships = this.getRelationshipsForNode(nodeId);
        relationships.forEach(rel => this.removeRelationship(rel.id));
        this.nodes.delete(nodeId);
        delete this.index.nodeToRelationships[nodeId];
      }
      
      removeRelationship(relId) {
        const rel = this.relationships.get(relId);
        if (rel) {
          // 从索引中删除
          this.index.nodeToRelationships[rel.startNodeId] = 
            this.index.nodeToRelationships[rel.startNodeId].filter(id => id !== relId);
          this.index.nodeToRelationships[rel.endNodeId] = 
            this.index.nodeToRelationships[rel.endNodeId].filter(id => id !== relId);
          this.relationships.delete(relId);
        }
      }
    }
    
    // 简化版工具函数
    const GraphUtils = {
      generateId() {
        return Date.now().toString(36) + Math.random().toString(36).substr(2);
      },
      generateNodeId() {
        return 'node_' + this.generateId();
      },
      generateRelationshipId() {
        return 'rel_' + this.generateId();
      }
    };
  </script>
  
  <!-- 简化版CanvasManager -->
  <script src="./CanvasManager.js"></script>
  <script src="./ModeManager.js"></script>
  <script src="./TreeCanvasManager.js"></script>
  <script src="./NetworkCanvasManager.js"></script>
  <script src="./ContextMenuManager.js"></script>
  <script src="./index.js"></script>
  
  <!-- 示例代码 -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // 初始化GraphDataService
      const graphService = new GraphDataService();
      
      // 创建一些示例数据
      createSampleData(graphService, GraphUtils);
      
      // 初始化双画布编辑器
      const editor = new DualCanvasEditor({
        treeCanvas: document.getElementById('tree-canvas'),
        networkCanvas: document.getElementById('network-canvas'),
        graphService: graphService
      });
      
      // 初始化编辑器
      editor.init();
      
      // 添加模式切换按钮事件监听
      document.getElementById('select-mode-btn').addEventListener('click', () => {
        editor.modeManager.setMode('select');
        updateModeButtons('select');
      });
      
      document.getElementById('node-mode-btn').addEventListener('click', () => {
        editor.modeManager.setMode('node');
        updateModeButtons('node');
      });
      
      document.getElementById('relationship-mode-btn').addEventListener('click', () => {
        const type = prompt('请选择关系类型 (CHILD_OF 或 RELATES_TO):', 'RELATES_TO');
        if (type === 'CHILD_OF' || type === 'RELATES_TO') {
          editor.modeManager.setMode('relationship');
          editor.modeManager.setRelationshipType(type);
          updateModeButtons('relationship');
        }
      });
      
      // 重置按钮事件
      document.getElementById('reset-btn').addEventListener('click', () => {
        editor.treeCanvasManager.resetView();
        editor.networkCanvasManager.resetView();
      });
      
      // 更新模式按钮状态
      function updateModeButtons(activeMode) {
        document.getElementById('select-mode-btn').classList.toggle('active', activeMode === 'select');
        document.getElementById('node-mode-btn').classList.toggle('active', activeMode === 'node');
        document.getElementById('relationship-mode-btn').classList.toggle('active', activeMode === 'relationship');
      }
      
      // 添加属性面板更新事件监听
      editor.eventBus.on('selectionChanged', (selection) => {
        updatePropertyPanel(selection);
      });
      
      // 更新属性面板
      function updatePropertyPanel(selection) {
        const propertyPanel = document.getElementById('property-panel');
        propertyPanel.innerHTML = '';
        
        if (!selection) {
          propertyPanel.innerHTML = '<p>请选择一个节点或关系查看属性</p>';
          return;
        }
        
        if (selection.type === 'node') {
          const node = graphService.getNode(selection.id);
          if (node) {
            propertyPanel.innerHTML = `
              <h3>节点属性</h3>
              <div><strong>ID:</strong> ${node.id}</div>
              <div><strong>标签:</strong> ${node.labels.join(', ')}</div>
              <h4>属性</h4>
              ${Object.entries(node.properties || {}).map(([key, value]) => `
                <div>${key}: ${value}</div>
              `).join('')}
            `;
          }
        } else if (selection.type === 'relationship') {
          const relationship = graphService.getRelationship(selection.id);
          if (relationship) {
            propertyPanel.innerHTML = `
              <h3>关系属性</h3>
              <div><strong>ID:</strong> ${relationship.id}</div>
              <div><strong>类型:</strong> ${relationship.type}</div>
              <h4>属性</h4>
              ${Object.entries(relationship.properties || {}).map(([key, value]) => `
                <div>${key}: ${value}</div>
              `).join('')}
            `;
          }
        }
      }
      
      // 创建示例数据函数
      function createSampleData(graphService, GraphUtils) {
        try {
          // 创建根节点
          const rootNode = {
            id: GraphUtils.generateNodeId(),
            labels: ['Root'],
            properties: {
              name: '根节点',
              description: '这是层级树的根节点'
            }
          };
          graphService.addNode(rootNode);
          
          // 创建一级子节点
          const childNode1 = {
            id: GraphUtils.generateNodeId(),
            labels: ['Level1'],
            properties: {
              name: '子节点1',
              description: '这是第一个一级子节点'
            }
          };
          graphService.addNode(childNode1);
          
          const childNode2 = {
            id: GraphUtils.generateNodeId(),
            labels: ['Level1'],
            properties: {
              name: '子节点2',
              description: '这是第二个一级子节点'
            }
          };
          graphService.addNode(childNode2);
          
          // 创建二级子节点
          const grandChildNode1 = {
            id: GraphUtils.generateNodeId(),
            labels: ['Level2'],
            properties: {
              name: '孙子节点1',
              description: '这是第一个二级子节点'
            }
          };
          graphService.addNode(grandChildNode1);
          
          // 创建关系
          const rel1 = {
            id: GraphUtils.generateRelationshipId(),
            type: 'CHILD_OF',
            startNodeId: childNode1.id,
            endNodeId: rootNode.id
          };
          graphService.addRelationship(rel1);
          
          const rel2 = {
            id: GraphUtils.generateRelationshipId(),
            type: 'CHILD_OF',
            startNodeId: childNode2.id,
            endNodeId: rootNode.id
          };
          graphService.addRelationship(rel2);
          
          const rel3 = {
            id: GraphUtils.generateRelationshipId(),
            type: 'CHILD_OF',
            startNodeId: grandChildNode1.id,
            endNodeId: childNode1.id
          };
          graphService.addRelationship(rel3);
          
          // 创建RELATES_TO关系
          const rel4 = {
            id: GraphUtils.generateRelationshipId(),
            type: 'RELATES_TO',
            startNodeId: childNode1.id,
            endNodeId: childNode2.id,
            properties: {
              relation: '相关联'
            }
          };
          graphService.addRelationship(rel4);
          
          console.log('示例数据创建成功');
        } catch (error) {
          console.error('创建示例数据失败:', error);
        }
      }
    });
  </script>
</body>
</html>
