<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>双视图演示</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
        }
        .container {
            display: flex;
            gap: 20px;
            height: calc(100vh - 40px);
        }
        .canvas-container {
            flex: 1;
            border: 1px solid #ccc;
            overflow: hidden;
            position: relative;
        }
        canvas {
            width: 100%;
            height: 100%;
        }
        h2 {
            text-align: center;
            margin-top: 0;
        }
        button {
            margin: 10px;
            padding: 8px 16px;
        }
    </style>
</head>
<body>
    <h1>双视图同步演示</h1>
    <div>
        <button id="addNodeBtn">添加节点</button>
        <button id="addRelBtn">添加关系</button>
    </div>
    <div class="container">
        <div class="canvas-container">
            <h2>网络图视图</h2>
            <canvas id="networkCanvas"></canvas>
        </div>
        <div class="canvas-container">
            <h2>树形图视图</h2>
            <canvas id="treeCanvas"></canvas>
        </div>
    </div>

    <script src="../../js/services/graphDataService.js"></script>
    <script>
        // 简单的EventBus实现
        class EventBus {
            constructor() {
                this.listeners = {};
            }

            on(event, callback) {
                if (!this.listeners[event]) {
                    this.listeners[event] = [];
                }
                this.listeners[event].push(callback);
            }

            emit(event, data) {
                if (this.listeners[event]) {
                    this.listeners[event].forEach(callback => callback(data));
                }
            }

            off(event, callback) {
                if (this.listeners[event]) {
                    this.listeners[event] = this.listeners[event].filter(cb => cb !== callback);
                }
            }
        }

        // GraphService is now loaded from external file

        // 简单的CanvasManager基类
        class CanvasManager {
            constructor(canvasId, graphService, eventBus) {
                this.canvas = document.getElementById(canvasId);
                this.ctx = this.canvas.getContext('2d');
                this.graphService = graphService;
                this.eventBus = eventBus;
                this.selectedNodeId = null;
                this.isDragging = false;
                this.dragOffset = { x: 0, y: 0 };
                
                this._resizeCanvas();
                window.addEventListener('resize', () => this._resizeCanvas());
                
                this.canvas.addEventListener('mousedown', (e) => this._handleMouseDown(e));
                this.canvas.addEventListener('mousemove', (e) => this._handleMouseMove(e));
                this.canvas.addEventListener('mouseup', (e) => this._handleMouseUp(e));
            }

            _resizeCanvas() {
                const rect = this.canvas.getBoundingClientRect();
                this.canvas.width = rect.width;
                this.canvas.height = rect.height;
                this.render();
            }

            _getMousePos(e) {
                const rect = this.canvas.getBoundingClientRect();
                return {
                    x: e.clientX - rect.left,
                    y: e.clientY - rect.top
                };
            }

            _getNodeAtPosition(pos) {
                // 简化版实现，实际需要根据具体视图计算
                return null;
            }

            _handleMouseDown(e) {
                const mousePos = this._getMousePos(e);
                const node = this._getNodeAtPosition(mousePos);
                
                if (node) {
                    this.selectedNodeId = node.id;
                    this.isDragging = true;
                    this.dragOffset.x = mousePos.x - node.x;
                    this.dragOffset.y = mousePos.y - node.y;
                } else {
                    this.selectedNodeId = null;
                }
            }

            _handleMouseMove(e) {
                if (this.isDragging && this.selectedNodeId) {
                    const mousePos = this._getMousePos(e);
                    const node = this.graphService.getNode(this.selectedNodeId);
                    if (node) {
                        node.x = mousePos.x - this.dragOffset.x;
                        node.y = mousePos.y - this.dragOffset.y;
                        this.render();
                    }
                }
            }

            _handleMouseUp(e) {
                if (this.isDragging) {
                    this.isDragging = false;
                    this.eventBus.emit('data:sync', { type: 'node', id: this.selectedNodeId });
                }
            }

            render() {
                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
                this._renderContent();
            }

            _renderContent() {
                // 由子类实现
            }
        }

        // 网络图视图管理器
        class NetworkCanvasManager extends CanvasManager {
            constructor(canvasId, graphService, eventBus) {
                super(canvasId, graphService, eventBus);
                this.nodeRadius = 20;
            }

            _getNodeAtPosition(pos) {
                // 简化实现
                for (const node of this.graphService.nodes.values()) {
                    const dx = node.x - pos.x;
                    const dy = node.y - pos.y;
                    if (dx * dx + dy * dy <= this.nodeRadius * this.nodeRadius) {
                        return node;
                    }
                }
                return null;
            }

            _renderContent() {
                // 渲染节点
                for (const node of this.graphService.nodes.values()) {
                    this.ctx.beginPath();
                    this.ctx.arc(node.x, node.y, this.nodeRadius, 0, Math.PI * 2);
                    this.ctx.fillStyle = node.id === this.selectedNodeId ? '#ff6b6b' : '#4ecdc4';
                    this.ctx.fill();
                    this.ctx.strokeStyle = '#333';
                    this.ctx.stroke();
                    
                    // 渲染节点标签
                    this.ctx.fillStyle = '#000';
                    this.ctx.font = '12px Arial';
                    this.ctx.textAlign = 'center';
                    this.ctx.textBaseline = 'middle';
                    this.ctx.fillText(node.label || node.id, node.x, node.y);
                }
                
                // 渲染关系
                for (const rel of this.graphService.relationships.values()) {
                    const startNode = this.graphService.getNode(rel.startNodeId);
                    const endNode = this.graphService.getNode(rel.endNodeId);
                    
                    if (startNode && endNode) {
                        this.ctx.beginPath();
                        this.ctx.moveTo(startNode.x, startNode.y);
                        this.ctx.lineTo(endNode.x, endNode.y);
                        this.ctx.strokeStyle = '#666';
                        this.ctx.stroke();
                    }
                }
            }
        }

        // 树形图视图管理器
        class TreeCanvasManager extends CanvasManager {
            constructor(canvasId, graphService, eventBus) {
                super(canvasId, graphService, eventBus);
                this.nodeRadius = 15;
                this.levelSpacing = 80;
                this.siblingSpacing = 50;
            }

            _getNodeAtPosition(pos) {
                // 获取布局后的节点位置
                const hierarchy = this.graphService.getHierarchyTree();
                for (const rootId in hierarchy) {
                    const node = this._findNodeInTree(hierarchy[rootId], pos);
                    if (node) return node.node;
                }
                return null;
            }

            _findNodeInTree(treeNode, pos) {
                if (!treeNode || !treeNode.node) return null;
                
                const dx = treeNode.x - pos.x;
                const dy = treeNode.y - pos.y;
                if (dx * dx + dy * dy <= this.nodeRadius * this.nodeRadius) {
                    return treeNode;
                }
                
                for (const child of treeNode.children) {
                    const result = this._findNodeInTree(child, pos);
                    if (result) return result;
                }
                
                return null;
            }

            _calculateSubtreeWidth(node, level) {
                if (!node || !node.node) return this.siblingSpacing;
                
                if (node.children.length === 0) {
                    return this.siblingSpacing;
                }
                
                let totalWidth = 0;
                for (const child of node.children) {
                    totalWidth += this._calculateSubtreeWidth(child, level + 1);
                }
                
                return totalWidth;
            }

            _layoutSubtree(node, x, y) {
                if (!node || !node.node) return;
                
                node.x = x;
                node.y = y;
                node.node.x = x; // 同步到原始节点对象
                node.node.y = y;
                
                if (node.children.length > 0) {
                    let childX = x - this._calculateSubtreeWidth(node, 0) / 2 + this.siblingSpacing / 2;
                    
                    for (const child of node.children) {
                        const subtreeWidth = this._calculateSubtreeWidth(child, 0);
                        this._layoutSubtree(child, childX + subtreeWidth / 2, y + this.levelSpacing);
                        childX += subtreeWidth;
                    }
                }
            }

            _autoLayout() {
                const hierarchy = this.graphService.getHierarchyTree();
                
                if (!hierarchy || Object.keys(hierarchy).length === 0) {
                    return;
                }
                
                let x = 50;
                const y = 50;
                
                for (const rootId in hierarchy) {
                    const subtreeWidth = this._calculateSubtreeWidth(hierarchy[rootId], 0);
                    this._layoutSubtree(hierarchy[rootId], x + subtreeWidth / 2, y);
                    x += subtreeWidth + 50;
                }
            }

            _renderContent() {
                this._autoLayout();
                
                const hierarchy = this.graphService.getHierarchyTree();
                
                // 渲染关系
                for (const rootId in hierarchy) {
                    this._renderTreeRelationships(hierarchy[rootId]);
                }
                
                // 渲染节点
                for (const rootId in hierarchy) {
                    this._renderTreeNode(hierarchy[rootId]);
                }
            }

            _renderTreeNode(treeNode) {
                if (!treeNode || !treeNode.node) return;
                
                this.ctx.beginPath();
                this.ctx.arc(treeNode.x, treeNode.y, this.nodeRadius, 0, Math.PI * 2);
                this.ctx.fillStyle = treeNode.node.id === this.selectedNodeId ? '#ff6b6b' : '#45b7d1';
                this.ctx.fill();
                this.ctx.strokeStyle = '#333';
                this.ctx.stroke();
                
                // 渲染节点标签
                this.ctx.fillStyle = '#000';
                this.ctx.font = '10px Arial';
                this.ctx.textAlign = 'center';
                this.ctx.textBaseline = 'middle';
                this.ctx.fillText(treeNode.node.label || treeNode.node.id, treeNode.x, treeNode.y);
                
                // 递归渲染子节点
                for (const child of treeNode.children) {
                    this._renderTreeNode(child);
                }
            }

            _renderTreeRelationships(treeNode) {
                if (!treeNode || !treeNode.node) return;
                
                for (const child of treeNode.children) {
                    this.ctx.beginPath();
                    this.ctx.moveTo(treeNode.x, treeNode.y + this.nodeRadius);
                    
                    // 绘制垂直和水平线
                    const midY = (treeNode.y + child.y) / 2;
                    this.ctx.lineTo(treeNode.x, midY);
                    this.ctx.lineTo(child.x, midY);
                    this.ctx.lineTo(child.x, child.y - this.nodeRadius);
                    
                    this.ctx.strokeStyle = '#666';
                    this.ctx.stroke();
                    
                    // 递归渲染子节点的关系
                    this._renderTreeRelationships(child);
                }
            }
        }

        // 双视图管理器
        class DualCanvasManager {
            constructor(options) {
                this.networkCanvasManager = options.networkCanvasManager;
                this.treeCanvasManager = options.treeCanvasManager;
                this.eventBus = options.eventBus;
                
                this._bindEvents();
            }

            _bindEvents() {
                // 绑定数据同步事件
                this.eventBus.on('data:sync', (data) => {
                    // 当一个视图中的节点位置改变时，更新另一个视图
                    this.networkCanvasManager.render();
                    this.treeCanvasManager.render();
                });
            }

            render() {
                this.networkCanvasManager.render();
                this.treeCanvasManager.render();
            }
        }

        // 初始化
        document.addEventListener('DOMContentLoaded', () => {
            const eventBus = new EventBus();
            const graphService = new GraphDataService({ eventBus: eventBus });
            
            const networkCanvasManager = new NetworkCanvasManager('networkCanvas', graphService, eventBus);
            const treeCanvasManager = new TreeCanvasManager('treeCanvas', graphService, eventBus);
            
            const dualCanvasManager = new DualCanvasManager({
                networkCanvasManager,
                treeCanvasManager,
                eventBus
            });

            // 添加一些测试数据
            const node1 = { id: '1', label: '节点1', x: 200, y: 150 };
            const node2 = { id: '2', label: '节点2', x: 300, y: 100 };
            const node3 = { id: '3', label: '节点3', x: 300, y: 200 };
            
            graphService.addNode(node1);
            graphService.addNode(node2);
            graphService.addNode(node3);
            
            graphService.addRelationship({ id: 'r1', type: 'CHILD_OF', startNodeId: '1', endNodeId: '2' });
            graphService.addRelationship({ id: 'r2', type: 'CHILD_OF', startNodeId: '1', endNodeId: '3' });
            
            dualCanvasManager.render();

            // 添加节点按钮
            document.getElementById('addNodeBtn').addEventListener('click', () => {
                const id = Date.now().toString();
                const node = { id, label: `节点${id.slice(-3)}`, x: Math.random() * 400 + 50, y: Math.random() * 300 + 50 };
                graphService.addNode(node);
                dualCanvasManager.render();
            });

            // 添加关系按钮
            document.getElementById('addRelBtn').addEventListener('click', () => {
                const nodes = Array.from(graphService.nodes.values());
                if (nodes.length >= 2) {
                    const node1 = nodes[Math.floor(Math.random() * nodes.length)];
                    let node2;
                    do {
                        node2 = nodes[Math.floor(Math.random() * nodes.length)];
                    } while (node1.id === node2.id);
                    
                    const id = `r${Date.now()}`;
                    graphService.addRelationship({ id, type: 'CHILD_OF', startNodeId: node1.id, endNodeId: node2.id });
                    dualCanvasManager.render();
                }
            });
        });
    </script>
</body>
</html>
