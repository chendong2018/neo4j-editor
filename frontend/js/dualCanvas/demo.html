<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>双画布图编辑器演示</title>
  <!-- 加载必要的工具和服务 -->
  <script src="../../../js/utils/utils.js"></script>
  <script src="../../../js/services/graphDataService.js"></script>
  <!-- 加载双画布编辑器组件 -->
  <script src="./EventBus.js"></script>
  <script src="./CanvasManager.js"></script>
  <script src="./ModeManager.js"></script>
  <script src="./TreeCanvasManager.js"></script>
  <script src="./NetworkCanvasManager.js"></script>
  <script src="./ContextMenuManager.js"></script>
  <script src="./index.js"></script>
  <!-- 加载示例代码 -->
  <script src="./example.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    
    .toolbar {
      background-color: #f5f5f5;
      padding: 10px;
      border-bottom: 1px solid #ddd;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    
    .mode-buttons {
      display: flex;
      gap: 5px;
    }
    
    .mode-buttons button {
      padding: 8px 16px;
      border: 1px solid #ccc;
      background-color: white;
      cursor: pointer;
      border-radius: 4px;
    }
    
    .mode-buttons button:hover {
      background-color: #e0e0e0;
    }
    
    .mode-buttons button.active {
      background-color: #4CAF50;
      color: white;
      border-color: #4CAF50;
    }
    
    .content {
      flex: 1;
      display: flex;
      overflow: hidden;
    }
    
    .canvas-container {
      flex: 1;
      border-right: 1px solid #ddd;
      position: relative;
    }
    
    .canvas-container:last-child {
      border-right: none;
    }
    
    canvas {
      width: 100%;
      height: 100%;
      cursor: default;
    }
    
    .canvas-title {
      position: absolute;
      top: 10px;
      left: 10px;
      background-color: rgba(255, 255, 255, 0.9);
      padding: 5px 10px;
      border-radius: 4px;
      font-weight: bold;
      z-index: 10;
    }
    
    .property-panel {
      width: 300px;
      background-color: #f9f9f9;
      border-left: 1px solid #ddd;
      overflow-y: auto;
      padding: 20px;
    }
    
    .property-panel h3 {
      margin-top: 0;
      font-size: 18px;
      border-bottom: 1px solid #ddd;
      padding-bottom: 10px;
    }
    
    .property-group {
      margin-bottom: 20px;
    }
    
    .property {
      margin-bottom: 8px;
    }
    
    .property label {
      font-weight: bold;
      display: inline-block;
      width: 80px;
    }
    
    .property-section {
      margin-top: 15px;
    }
    
    .property-section h4 {
      margin-top: 0;
      margin-bottom: 10px;
      font-size: 14px;
      color: #666;
    }
    
    .property-item {
      margin-bottom: 8px;
      display: flex;
      align-items: center;
    }
    
    .property-item label {
      flex: 0 0 80px;
      font-weight: normal;
    }
    
    .property-item input {
      flex: 1;
      padding: 4px 6px;
      border: 1px solid #ccc;
      border-radius: 3px;
    }
    
    button {
      padding: 8px 16px;
      background-color: #2196F3;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    
    button:hover {
      background-color: #1976D2;
    }
    
    #reset-btn {
      margin-left: auto;
      background-color: #f44336;
    }
    
    #reset-btn:hover {
      background-color: #d32f2f;
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <div class="mode-buttons">
      <button id="select-mode-btn" class="active">选择模式</button>
      <button id="node-mode-btn">节点模式</button>
      <button id="relationship-mode-btn">关系模式</button>
    </div>
    <button id="reset-btn">重置编辑器</button>
  </div>
  
  <div class="content">
    <div class="canvas-container">
      <div class="canvas-title">层级树画布</div>
      <canvas id="tree-canvas"></canvas>
    </div>
    
    <div class="canvas-container">
      <div class="canvas-title">关系网画布</div>
      <canvas id="network-canvas"></canvas>
    </div>
    
    <div class="property-panel" id="property-panel">
      <p>请选择一个节点或关系查看属性</p>
    </div>
  </div>
  
  <!-- 加载依赖 -->
  <script src="../services/graphDataService.js"></script>
  <script src="../utils/graphUtils.js"></script>
  
  <!-- 加载双画布编辑器组件 -->
  <script src="CanvasManager.js"></script>
  <script src="TreeCanvasManager.js"></script>
  <script src="NetworkCanvasManager.js"></script>
  <script src="ModeManager.js"></script>
  <script src="ContextMenuManager.js"></script>
  <script src="index.js"></script>
  
  <!-- 加载示例代码 -->
  <script src="example.js"></script>
</body>
</html>
