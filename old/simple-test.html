<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>简单测试页面</title>
</head>
<body>
    <h1>简单测试页面</h1>
    <p>请查看浏览器控制台以查看测试结果</p>
    
    <script>
        // 直接在这里定义viewSync对象
        console.log('开始测试...');
        window.viewSync = {
            version: '1.0.0',
            initialized: false,
            switchViewMode: function(mode) {
                console.log(`切换视图模式: ${mode}`);
                window.currentViewMode = mode;
                return true;
            },
            initializeDualViews: function() {
                console.log('初始化双视图...');
                this.initialized = true;
                return { success: true, message: '双视图初始化完成' };
            },
            testSync: function() {
                console.log('🔄 viewSync 同步测试运行中...');
                return {
                    status: 'success',
                    viewSyncReady: true,
                    viewMode: window.currentViewMode || 'single',
                    timestamp: new Date().toISOString()
                };
            }
        };
        
        // 初始化全局变量
        window.sharedGraphData = { nodes: [], edges: [], lastSync: new Date().toISOString() };
        window.currentViewMode = 'single';
        
        console.log('✅ viewSync 对象已成功创建并暴露到全局');
        console.log('viewSync 可用方法:', Object.keys(window.viewSync));
        
        // 立即测试
        console.log('===== 执行测试 =====');
        console.log('viewSync 是否存在:', typeof window.viewSync !== 'undefined');
        if (window.viewSync) {
            const testResult = window.viewSync.testSync();
            console.log('testSync 结果:', testResult);
        }
    </script>
</body>
</html>
