<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>简单加载测试 - Neo4j Editor</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            padding: 0;
        }
        .error {
            color: red;
            font-weight: bold;
        }
        .success {
            color: green;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1>简单加载测试</h1>
    <div id="status">等待main.js加载...</div>
    
    <script>
        // 记录加载开始时间
        console.log('开始加载main.js');
        
        // 创建script元素并手动加载main.js，以便更好地控制和错误处理
        const script = document.createElement('script');
        script.src = 'js/main.js';
        
        script.onload = function() {
            console.log('main.js加载完成');
            
            // 检查neo4jEditor对象是否存在
            if (window.neo4jEditor) {
                document.getElementById('status').className = 'success';
                document.getElementById('status').textContent = 'main.js加载成功！neo4jEditor对象已创建。';
                console.log('neo4jEditor对象:', window.neo4jEditor);
            } else {
                document.getElementById('status').className = 'error';
                document.getElementById('status').textContent = 'main.js加载完成，但neo4jEditor对象未定义。';
            }
        };
        
        script.onerror = function() {
            console.error('main.js加载失败');
            document.getElementById('status').className = 'error';
            document.getElementById('status').textContent = 'main.js加载失败！';
        };
        
        // 添加到文档中
        document.head.appendChild(script);
    </script>
</body>
</html>
