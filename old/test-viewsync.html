<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>viewSync 测试页面</title>
    <script src="js/viewSync.js"></script>
</head>
<body>
    <h1>viewSync 测试页面</h1>
    <p>请查看浏览器控制台以查看测试结果</p>
    
    <script>
        // 直接在页面加载后检查viewSync对象
        window.onload = function() {
            console.log('===== 直接测试 viewSync 对象 =====');
            console.log('viewSync 是否存在:', typeof window.viewSync !== 'undefined');
            if (window.viewSync) {
                console.log('viewSync 可用方法:', Object.keys(window.viewSync));
                console.log('sharedGraphData:', window.sharedGraphData);
                console.log('currentViewMode:', window.currentViewMode);
            } else {
                console.error('❌ viewSync 对象不存在');
            }
        };
    </script>
</body>
</html>
